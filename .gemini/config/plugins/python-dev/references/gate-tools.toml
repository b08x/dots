# Exact pins for every gate tool. tasks/gate-tools.md installs the [dev] entries with `uv add --dev <name>==<version>`.
# Binaries that are not on PyPI are checked, not installed. See the [binaries] table.
# Versions verified against PyPI at the time of pinning. Re-verify when bumping.

[dev]
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-randomly = "5.0.0"
pytest-bdd = "9.0.0"
gherkin-official = "42.0.1"
ruff = "0.17.2"
mypy = "2.4.0"
pyright = "1.1.414"
crap4py = "0.1.1"
mutmut = "3.8.0"
pip-audit = "2.10.1"
bandit = "1.9.4"
tach = "0.35.3"
import-linter = "2.15"
interrogate = "1.7.0"
pydoclint = "0.11.1"
deptry = "0.25.1"
pylint = "4.1.3"

[binaries.gitleaks]
# Go binary, not on PyPI. Installed outside the project. A missing binary yields `not run: gitleaks unavailable`.
check = "gitleaks version"
install_hint = "brew install gitleaks"
