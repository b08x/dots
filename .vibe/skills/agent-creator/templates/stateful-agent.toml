# Stateful Agent Template
# Variables: {agent_id}, {agent_name}, {description}, {safety_level}, {bypass_tool_permissions}
#
# Verified against mistral-vibe (vibe/core/agents/models.py AgentProfile.from_toml):
# - The agent name comes from the FILENAME stem; there is no `id` key.
# - agent_type omitted = "agent" = selectable via `vibe --agent`.
# - There is no `auto_approve` key; use bypass_tool_permissions (bool).
# - There is no `user_invocable` key.

display_name = "{agent_name}"
description = """{description}"""
safety = "{safety_level}"
bypass_tool_permissions = {bypass_tool_permissions}
system_prompt_id = "{agent_id}"

enabled_tools = ["todo", "ask_user_question", "read_file", "write_file"]
disabled_tools = ["bash", "task"]

[tools.todo]
permission = "always"

[tools.ask_user_question]
permission = "always"

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[session_logging]
session_prefix = "{agent_id}"
enabled = true
