# Base Subagent Template
# Variables: {subagent_id}, {agent_name}, {description}, {safety_level}
#
# Verified against mistral-vibe (vibe/core/agents/models.py and
# app_server/_agent_types.py):
# - The subagent name comes from the FILENAME stem; there is no `id` key.
# - agent_type = "subagent" makes this profile spawnable via agentType
#   (tools.subagent.spawn). It CANNOT be selected with `vibe --agent`;
#   only agent_type = "agent" profiles can.
# - description MUST be non-empty, or the profile is not advertised.
# - instructions or system_prompt_id supplies the child's system prompt;
#   explicit `instructions` wins over `system_prompt_id`.
# - There is no `auto_approve` or `user_invocable` key.

display_name = "{agent_name}"
description = """{description}"""
agent_type = "subagent"
safety = "{safety_level}"

enabled_tools = ["read_file", "grep"]
disabled_tools = ["write_file", "search_replace", "bash", "task"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
session_prefix = "{subagent_id}"
enabled = true
