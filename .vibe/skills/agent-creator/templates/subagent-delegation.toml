# Subagent Delegation Template (parent agent)
# Variables: {agent_id}, {agent_name}, {description}
#
# Verified against mistral-vibe (vibe/core/agents/models.py AgentProfile.from_toml):
# - The agent name comes from the FILENAME stem; there is no `id` key.
# - agent_type omitted = "agent" = selectable via `vibe --agent`. The children
#   this parent spawns are defined separately with templates/subagent.toml
#   (agent_type = "subagent").
# - There is no `auto_approve` key; use bypass_tool_permissions (bool).
# - There is no `user_invocable` key.

display_name = "{agent_name}"
description = """{description}"""
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "{agent_id}"

enabled_tools = ["read_file", "grep", "task", "ask_user_question"]
disabled_tools = ["write_file", "search_replace"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.task]
permission = "always"

[tools.ask_user_question]
permission = "always"

[session_logging]
session_prefix = "{agent_id}"
enabled = true
