# Tool Orchestrator Template
# Variables: {agent_id}, {agent_name}, {description}, {bash_allowlist}, {safety_level}
# NOTE: bash_allowlist must be a TOML array, e.g. ["git", "curl", "jq"]
#
# Verified against mistral-vibe (vibe/core/agents/models.py AgentProfile.from_toml):
# - The agent name comes from the FILENAME stem; there is no `id` key.
# - agent_type omitted = "agent" = selectable via `vibe --agent`.
# - [tools.bash] supports permission, allowlist, denylist, default_timeout.
# - write_file has no denylist field — restrict paths via permission="ask"
#   and the system prompt.
# - There is no `auto_approve` key; use bypass_tool_permissions (bool).
# - There is no `user_invocable` key.

display_name = "{agent_name}"
description = """{description}"""
safety = "{safety_level}"
bypass_tool_permissions = false
system_prompt_id = "{agent_id}"

enabled_tools = ["bash", "read_file", "write_file", "ask_user_question"]
disabled_tools = ["grep", "task"]

[tools.bash]
permission = "ask"
allowlist = {bash_allowlist}
denylist = [
    "rm", "rm -rf", "curl | bash", "wget | bash", "sudo", "su", "passwd",
    "useradd", "usermod", "groupadd", "apt", "yum", "dnf", "pacman",
    "chmod -R", "chown", "chgrp", "dd", "mkfs", "gdb", "pdb", "strace",
    "tcpdump", "wireshark", "tshark", "nmap", "> /dev/sd*", "mv /", "cp -r /"
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.ask_user_question]
permission = "always"

[session_logging]
session_prefix = "{agent_id}"
enabled = true
