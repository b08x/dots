# Single Agent Template
# Variables: {agent_id}, {agent_name}, {description}, {safety_level},
#            {bypass_tool_permissions}, {system_prompt_id}, {enabled_tools}, {disabled_tools}
#
# Verified against mistral-vibe (vibe/core/agents/models.py AgentProfile.from_toml):
# - The agent name comes from the FILENAME stem; there is no `id` key.
# - Profile fields: display_name, description, safety, agent_type, instructions.
# - agent_type defaults to "agent" when omitted = selectable via `vibe --agent`.
#   "subagent" = spawn-only via agentType; --agent will reject it.
# - enabled_tools is a glob allowlist; an EMPTY list means "no restriction",
#   NOT "no tools". To disable every tool use disabled_tools = ["*"].
# - There is no `auto_approve` key; use bypass_tool_permissions (bool).
# - There is no `user_invocable` key.

display_name = "{agent_name}"
description = """{description}"""
safety = "{safety_level}"
bypass_tool_permissions = {bypass_tool_permissions}
system_prompt_id = "{system_prompt_id}"

enabled_tools = {enabled_tools}
disabled_tools = {disabled_tools}

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
session_prefix = "{agent_id}"
enabled = true
