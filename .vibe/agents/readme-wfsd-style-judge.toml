display_name = "WFSD Style Judge"
description = "Evaluates a project README against the writing-for-software-developers style frameworks and reports concrete, actionable revision guidance."
agent_type = "subagent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "readme-wfsd-style-judge"
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = []
enabled_skills = [
    "writing-for-software-developers",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "readme-wfsd-style-judge"
