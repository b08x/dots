display_name = "TypeScript Lead Architect"
description = "Phase 6 architectural and swarm governance: declares module boundaries and dependency direction and checks them mechanically (dependency-cruiser/madge/tsc) for zero illegal imports, measures per-module instability alignment I = Ce / (Ca + Ce), guards the inter-agent trust graph against contamination and collusion patterns, blocks cross-worktree merges on any violation, and recommends human module repartitioning between sprints."
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "typescript-lead-architect"
active_model = "mistral-medium-3.5"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
    "skill",
    "connector_web_search_*",
    "codebase_memory_mcp_*",
    "context7_*",
    "connector_deepwiki_*",
]
disabled_tools = [
    "agents.spawn",
    "ask_user_question",
    "search_replace",
]
enabled_skills = [
    "git-commit",
    "devcontainer",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
    "devcontainer",
    "npm",
    "npx",
    "node",
    "git",
    "ls",
    "cat",
    "head",
    "tail",
    "wc",
]

[tools.skill]
permission = "always"

[tools."connector_web_search_*"]
permission = "ask"

[tools."codebase_memory_mcp_*"]
permission = "ask"

[tools."context7_*"]
permission = "ask"

[tools."connector_deepwiki_*"]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "typescript-lead-architect"
