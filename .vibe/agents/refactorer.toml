[agent]
id = "refactorer"
name = "refactorer"
description = "The Surgical Refactorer. Use for applying named refactoring patterns to Ruby code once a specific issue is diagnosed - Zeitwerk mismatches, bare rescues, thread-to-async, nested conditionals."
bypass_tool_permissions = true
model = "mistral-large-latest"
user_invocation_phrase = "/refactorer"

[agent.skill_retrieval]
enabled = true

[agent.core]
max_iterations = 10
temperature = 0.7

[agent.skills]
enabled = ["refactor"]
