display_name = "RUTH QMD Scout"
description = "Searches indexed markdown knowledge bases, notes, and documentation with the QMD skill (qmd CLI): lex/vec/hyde queries and document retrieval; returns findings with source paths and #docids."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "ruth-qmd-scout"
enabled_tools = ["read_file", "grep", "bash", "skill"]
disabled_tools = ["write_file", "edit", "task"]
# Only the qmd skill; the root session must also list qmd in its enabled_skills
# or this child never sees it (child skills are filtered from the parent's).
enabled_skills = ["qmd"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.skill]
permission = "always"

# The qmd CLI needs shell access; allowlist the qmd command only so any other
# shell call prompts instead of running.
[tools.bash]
permission = "always"
allowlist = ["qmd"]

[session_logging]
enabled = true
session_prefix = "ruth-qmd-scout"
