display_name = "SFL Textual Judge"
description = "Textual metafunction judge for the SFL docs debate: audits theme-rheme progression (concrete to conditional), cohesion of causal/temporal connectives, and genre staging per the SFL templates."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "sfl-docs-textual-judge"
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = [
    "write_file",
    "edit",
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "sfl-docs-textual-judge"
