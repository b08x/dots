display_name = "SFL Interpersonal Judge"
description = "Interpersonal metafunction judge for the SFL docs debate: audits modality calibration against evidence quality, tenor and audience fit, and honest negative capability (what the system does not do)."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "sfl-docs-interpersonal-judge"
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = [
    "write_file",
    "edit",
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "sfl-docs-interpersonal-judge"
