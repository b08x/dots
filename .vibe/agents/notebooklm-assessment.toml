display_name = "NotebookLM Assessment"
description = "Completion endpoint for notebooklm-py DSPy assessment programs: claim detection, fact-check, SIFT moves, audio overview scoring, grounded corpus answers, compiler slot filling, chunk boundaries and SFL pass 2. Answers one flattened DSPy prompt in its exact field format. Uses no tools."
agent_type = "agent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "notebooklm-assessment"
disabled_tools = [
    "*",
]

[session_logging]
enabled = true
session_prefix = "notebooklm-assessment"
