display_name = "RPM Repo Publisher"
description = "Publishes verified builds and repositories to Fedora COPR with copr-cli for the orchestrator, creating chroots, submitting builds, and confirming repository state."
agent_type = "subagent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "rpm-repo-publisher"
enabled_tools = [
    "read_file",
    "grep",
    "bash",
]
disabled_tools = [
    "write_file",
    "search_replace",
    "agents.spawn",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "rpm-repo-publisher"
