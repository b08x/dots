display_name = "SFL Editor"
description = "Applies the debate's consensus fixes to documentation using SFL editing operations: unpacking nominalizations, modality repair, theme-rheme repair, and cohesion repair, keeping the diff minimal and reviewable."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "sfl-docs-editor"
enabled_tools = [
    "read_file",
    "grep",
    "write_file",
    "edit",
]
disabled_tools = [
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "sfl-docs-editor"
