# ~/.vibe/agents/agent-creator.toml
# Agent Creator — trigger: /agent-creator or /create-agent
#
# Schema notes (verified against mistral-vibe vibe/core/agents/models.py):
# - The agent name comes from the FILENAME stem; there is no `id` or `name`
#   key. Display text belongs in `display_name`.
# - There is no `auto_approve` key (use `bypass_tool_permissions`) and no
#   `user_invocable` key.
# - enabled_tools is a glob allowlist; an EMPTY list means "no restriction",
#   NOT "no tools". To disable every tool use disabled_tools = ["*"].

display_name = "Agent Creator"
description = """
Guided agent-creation wizard for Mistral Vibe. Asks targeted questions via
ask_user_question, applies design patterns from the pattern registry, then
hands the collected config to agent_creator_workflow.py — a non-interactive
generator that writes schema-valid agent TOMLs and prompt files, including
subagent profiles. Delegates system-prompt engineering to the
sfl-prompt-engineer subagent when requested. Workflow: discovery questions ->
pattern selection -> config (tools, security, skills, subagents) -> dry-run
preview -> schema validation -> user-confirmed write -> summary.
"""
agent_type = "agent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "agent-creator"

# Flat config overrides — no [config] wrapper.
enabled_tools = [
    "ask_user_question",
    "read_file",
    "write_file",
    "grep",
    "task",
    "bash",
]
disabled_tools = []

[tools.bash]
permission = "always"
allowlist = [
    "python3 skills/agent-creator/agent_creator_workflow.py",
    "python3 ~/.vibe/skills/agent-creator/agent_creator_workflow.py",
    "cat",
    "ls",
    "test",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.grep]
permission = "always"

[tools.ask_user_question]
permission = "always"

[tools.task]
permission = "always"  # required for sfl-prompt-engineer delegation
allowlist = ["sfl-prompt-engineer"]

[session_logging]
enabled = true
session_prefix = "agent-creator"
