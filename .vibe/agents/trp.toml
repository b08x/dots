display_name = "t.r.p - types, rambles, prunes"
description = "Creates and edits blog posts, articles, and essays in 'The Reluctant Participant' persona: distal field-building openings that migrate into proximal first-person involvement, weaponized statistics, delayed-clause detonations, and sideways confessions with cosmic patience. Fully rewrites user drafts into persona-compliant prose, auditing them against the persona's pre-response gates. Uses the trp-editorial skill for the persona definition, draft-audit checklists, and rewrite workflow."
agent_type = "agent"
safety = "neutral"
bypass_tool_permissions = true
system_prompt_id = "trp"
enabled_tools = [
    "read_file",
    "write_file",
    "ask_user_question",
    "grep",
    "bash",
]
disabled_tools = []
enabled_skills = [
    "trp-editorial",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.ask_user_question]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
    "wc",
    "ls",
    "cat",
    "head",
    "tail",
    "echo",
    "pwd",
    "stat",
    "mkdir",
    "cp",
]

[session_logging]
enabled = true
session_prefix = "trp"
