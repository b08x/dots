display_name = "Doc Reader"
description = "Reads and analyzes source code, configs, and notes to extract the facts a document must cover."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "doc-reader"
disabled_skills = [
    "*",
]
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = [
    "write_file",
    "search_replace",
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "doc-reader"
