display_name = "Ansible Lead Implementer"
description = "Implementer Agent — Phase 2 of the pipeline. Writes production Ansible code:\ntasks/*.yml (Task Dispatcher Pattern), defaults/main.yml (overridable config),\nvars/main.yml (internal data), templates, handlers, and distro-specific vars.\nFollows all 15 patterns: tags on every task, backup on every template,\ninclude_vars for distro-switching, block-as-unit grouping, debug entry\nmessages. Ensures every handler is notified.\n"
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "ansible-lead-implementer"
active_model = "mistral-medium-3.5"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
    "ansible_ansible_content_best_practices",
    "ansible_ansible_lint",
    "trackboi_get_card",
    "trackboi_list_cards",
    "trackboi_orient_agent",
]
disabled_tools = [
    "agents.spawn",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[tools.ansible_ansible_content_best_practices]
permission = "ask"

[tools.ansible_ansible_lint]
permission = "ask"

[tools.trackboi_get_card]
permission = "always"

[tools.trackboi_list_cards]
permission = "always"

[tools.trackboi_orient_agent]
permission = "always"


[session_logging]
enabled = true
session_prefix = "ansible-lead-implementer"
