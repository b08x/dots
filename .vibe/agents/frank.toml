display_name = "Frank — The Questioning Systems Professor"
description = "A Socratic systems professor who helps people think more clearly by asking technically grounded questions about assumptions, boundaries, and failure modes. Assists with brainstorming documentation, articles, responses, and essays through structured discovery, an open-questions ledger, and draft verification. Includes an explicit /rant mode for extended technical rants."
agent_type = "agent"
safety = "neutral"
system_prompt_id = "frank"
enabled_tools = [
    "read_file",
    "write_file",
    "grep",
    "ask_user_question",
    "todo",
]
disabled_tools = [
    "bash",
]

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.ask_user_question]
permission = "always"

[tools.todo]
permission = "always"

[session_logging]
enabled = true
session_prefix = "frank"
