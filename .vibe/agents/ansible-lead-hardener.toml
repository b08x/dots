display_name = "Ansible Lead Hardener"
description = "Hardener Agent — Phase 4 of the pipeline. Adds fail-fast pre-flight assertions\n(tasks/assert.yml) validating platform compatibility, package manager, init\nmanager, effective root permissions, and identity variables, per the platforms\ndocumented in the project skill. Verifies idempotency (skip-if-present guards\nhave *_force_install overrides), checks firewall rules are co-located and\ndata-driven, enforces the project's layer boundaries, and runs security-\nfocused lint checks.\n"
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "ansible-lead-hardener"
active_model = "codestral"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
    "ansible_ansible_content_best_practices",
    "ansible_ansible_lint",
    "trackboi_get_card",
    "trackboi_list_cards",
    "trackboi_orient_agent",
]
disabled_tools = [
    "agents.spawn",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[tools.ansible_ansible_content_best_practices]
permission = "ask"

[tools.ansible_ansible_lint]
permission = "ask"

[tools.trackboi_get_card]
permission = "always"

[tools.trackboi_list_cards]
permission = "always"

[tools.trackboi_orient_agent]
permission = "always"


[session_logging]
enabled = true
session_prefix = "ansible-lead-hardener"
