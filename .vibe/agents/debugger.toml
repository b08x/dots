[agent]
id = "debugger"
name = "debugger"
description = "The Stealth Debugger. Use for diagnosing Ruby issues - Zeitwerk errors, performance bottlenecks, dead code, root-cause investigation. Diagnosis only; hands findings to the refactorer."
bypass_tool_permissions = true
model = "mistral-large-latest"
user_invocation_phrase = "/debugger"

[agent.skill_retrieval]
enabled = true

[agent.core]
max_iterations = 10
temperature = 0.7

[agent.skills]
enabled = ["analyse"]
