display_name = "Documentationist"
description = "generates plain language technical documentation"
agent_type = "agent"
safety = "smart"
bypass_tool_permissions = true
system_prompt_id = "documentationist"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "ask_user_question",
    "task",
]
disabled_tools = [
    "bash",
]
enabled_skills = [
    "readme-generator",
    "doc-style",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "always"

[tools.edit]
permission = "always"

[tools.grep]
permission = "always"

[tools.ask_user_question]
permission = "always"

[tools.task]
permission = "always"
allowlist = [
    "doc-reader",
    "doc-writer",
]

[session_logging]
enabled = true
session_prefix = "documentationist"
