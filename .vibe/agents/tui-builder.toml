[agent]
id = "tui-builder"
name = "tui-builder"
description = "The TUI Builder. Use for terminal user interfaces in Ruby - interactive prompts, wizards, tables, progress bars, spinners, and rich CLI output with the TTY toolkit."
bypass_tool_permissions = true
model = "mistral-large-latest"
user_invocation_phrase = "/tui-builder"

[agent.skill_retrieval]
enabled = true

[agent.core]
max_iterations = 10
temperature = 0.7

[agent.skills]
enabled = ["tui"]
