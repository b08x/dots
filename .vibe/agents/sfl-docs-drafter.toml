display_name = "SFL Drafter"
description = "Drafts new technical documentation from SFL genre templates after register setup (Field/Tenor/Mode), grounding participants and circumstances in source material and Notebook corpus queries, then submits the draft for metafunction debate."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "sfl-docs-drafter"
enabled_tools = [
    "read_file",
    "grep",
    "write_file",
]
disabled_tools = [
    "edit",
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "sfl-docs-drafter"
