display_name = "TypeScript Lead QA"
description = "Phase 5 system QA, DAST and load verification on the merged hardened branch: compiles written QA procedures into deterministic Playwright scripts demanding a 100% E2E pass rate, runs k6/Locust load profiles against p95/p99 latency thresholds, drives the OWASP ZAP DAST pass demanding zero high alerts, and independently verifies execution logs against the spec procedures."
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "typescript-lead-qa"
active_model = "mistral-medium-3.5"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
    "skill",
    "connector_web_search_*",
    "codebase_memory_mcp_*",
    "context7_*",
    "connector_deepwiki_*",
]
disabled_tools = [
    "agents.spawn",
    "ask_user_question",
    "search_replace",
]
enabled_skills = [
    "git-commit",
    "devcontainer",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
    "devcontainer",
    "npm",
    "npx",
    "node",
    "k6",
    "locust",
    "zap-baseline.py",
    "git",
    "ls",
    "cat",
    "head",
    "tail",
    "wc",
]

[tools.skill]
permission = "always"

[tools."connector_web_search_*"]
permission = "ask"

[tools."codebase_memory_mcp_*"]
permission = "ask"

[tools."context7_*"]
permission = "ask"

[tools."connector_deepwiki_*"]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "typescript-lead-qa"
