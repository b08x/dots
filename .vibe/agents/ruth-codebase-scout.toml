display_name = "RUTH Codebase Scout"
description = "Reads source code, configs, and notes to extract the facts a document must cover; returns findings with file paths and line references."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "ruth-codebase-scout"
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = [
    "write_file",
    "search_replace",
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "ruth-codebase-scout"
