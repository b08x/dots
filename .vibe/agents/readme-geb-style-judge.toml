display_name = "GEB Style Judge"
description = "Evaluates a project README against the hofstadter-geb style frameworks (self-reference, formal systems, recursion, emergence) and reports actionable revision guidance."
agent_type = "subagent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "readme-geb-style-judge"
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = []
enabled_skills = [
    "hofstadter-geb",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "readme-geb-style-judge"
