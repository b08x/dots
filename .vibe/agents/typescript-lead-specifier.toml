display_name = "TypeScript Lead Specifier"
description = "Phase 1 specification and threat modeling: translates human stories into ephemeral Gherkin specs, executable QA procedures, and grounded STRIDE misuse cases; serializes the PRD traceability graph, marks trust-boundary crossings explicitly, and holds the coding handoff until the human checkpoint approves the specification."
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "typescript-lead-specifier"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
    "connector_web_search_*",
    "codebase_memory_mcp_*",
    "context7_*",
    "connector_deepwiki_*",
]
disabled_tools = [
    "agents.spawn",
    "ask_user_question",
    "search_replace",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
    "git",
    "ls",
    "cat",
    "head",
    "tail",
    "wc",
    "fd",
]

[tools."connector_web_search_*"]
permission = "ask"

[tools."codebase_memory_mcp_*"]
permission = "ask"

[tools."context7_*"]
permission = "ask"

[tools."connector_deepwiki_*"]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "typescript-lead-specifier"
