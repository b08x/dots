display_name = "SFL Ideational Judge"
description = "Ideational metafunction judge for the SFL docs debate: audits documentation drafts for process-type coverage (material/mental/relational), explicit participants, and circumstantial boundaries, citing the process-type validation checkers."
agent_type = "subagent"
safety = "safe"
bypass_tool_permissions = false
system_prompt_id = "sfl-docs-ideational-judge"
enabled_tools = [
    "read_file",
    "grep",
]
disabled_tools = [
    "write_file",
    "edit",
    "bash",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[session_logging]
enabled = true
session_prefix = "sfl-docs-ideational-judge"
