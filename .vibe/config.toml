active_model = "mistral-medium-3.5"
theme = "auto"
skill_paths = [
    "~/.vibe/skills",
    "~/.syncopated/skills",
    ".agents/skills/",
    "~/.gemini/skills",
]
applied_migrations = [
    "bash_read_only_defaults_v1",
]
connectors = [
    { name = "deepwiki", disabled = false },
]

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_VIBE_API_KEY"
backend = "mistral"
reasoning_field_name = "reasoning_content"

[tools.bash]
allowlist = [
    "/home/b08x/.local/bin/*",
    "/opt/asdf/installs/*",
    "asdf",
    "basename",
    "bundle",
    "cat",
    "cd",
    "cd /home/b08x/WorkspaceV3/Syncopated/ansible && jq '.cards.items[] | select(.trackId == \"track-role-hermes-llmops-1kzjfxq\")' /home/b08x/.vibe/logs/session/unified/11767668-003b-074c-e5dd-a3eff878d124/tool-results/run_typescript-sCvtN2oOW.json 2>/dev/null || echo \"No cards found or error\"",
    "cd /home/b08x/WorkspaceV3/Syncopated/ansible && jq '.tracks[] | select(.slug == \"role-hermes-llmops\")' /home/b08x/.vibe/logs/session/unified/11767668-003b-074c-e5dd-a3eff878d124/tool-results/run_typescript-sCvtN2oOW.json 2>/dev/null || echo \"Parsing failed, reading differently\"",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "echo \"=== COMPLETED CARDS ===\"; ls /home/b08x/WorkspaceV3/Syncopated/ansible/.trackboi/cards/card-*-hermes-* | while read card_dir; do card_name=$(basename \"$card_dir\"); card_file=\"$card_dir/index.md\"; column=$(grep \"^column:\" \"$card_file\" | head -1 | cut -d'\"' -f4); echo \"$card_name -> $column\"; done",
    "file",
    "find",
    "find /home/b08x/WorkspaceV3/Syncopated/ansible/collections/ansible_collections/b08x/llmops/roles -name \"hermes*\" -type d 2>/dev/null || echo \"Hermes role not found\"",
    "fmt",
    "fold",
    "for card_dir in /home/b08x/WorkspaceV3/Syncopated/ansible/.trackboi/cards/card-*-hermes-*; do echo \"=== $(basename $card_dir) ===\"; cat \"$card_dir/index.md\" | head -5; echo; done",
    "git checkout",
    "git diff",
    "git log",
    "git reset",
    "git rev-parse",
    "git status",
    "grep",
    "grep -r \"\\~\\/.hermes\\|/root/.hermes\" /home/b08x/WorkspaceV3/Syncopated/ansible/collections/ansible_collections/b08x/llmops/roles/hermes/ 2>/dev/null | head -20",
    "head",
    "join",
    "jq",
    "less",
    "ls",
    "ls -la /home/b08x/WorkspaceV3/Syncopated/ansible/.trackboi/ 2>/dev/null || ls -la /home/b08x/WorkspaceV3/Syncopated/ansible/.etc/.trackboi/ 2>/dev/null || ls -la /home/b08x/WorkspaceV3/Syncopated/ansible/.etc/trackboi/ 2>/dev/null || echo \"No trackboi directories found\"",
    "ls -la /home/b08x/WorkspaceV3/Syncopated/ansible/collections/ansible_collections/b08x/llmops/ 2>/dev/null || echo \"Directory not accessible\"",
    "ls -la /home/b08x/WorkspaceV3/Syncopated/ansible/collections/ansible_collections/b08x/llmops/roles/ 2>/dev/null | head -20",
    "ls -la ~/.local/bin/trackboi 2>/dev/null || echo \"not in ~/.local/bin\"",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "plannotator",
    "pwd",
    "read",
    "readlink",
    "ruby",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "timeout",
    "tr",
    "trackboi",
    "trackboi --version 2>&1 | head -5",
    "tree",
    "uname",
    "uniq",
    "wc",
    "which",
    "which trackboi 2>/dev/null || echo \"trackboi not in PATH\"",
    "whoami",
]

[tools.read_file]
allowlist = [
    "/home/b08x/.syncopated/skills/ruby-design-patterns/references/*",
    "/home/b08x/.vibe/logs/session/unified/11767668-003b-074c-e5dd-a3eff878d124/tool-results/*",
]

[tools.context7_query-docs]
permission = "always"

[tools.trackboi_list_projects]
permission = "always"

[tools.trackboi_switch_project]
permission = "always"

[tools.trackboi_get_active_project]
permission = "always"

[[mcp_servers]]
name = "codebase-memory-mcp"
transport = "stdio"
command = "/home/b08x/.local/bin/codebase-memory-mcp"
args = []

[[mcp_servers]]
transport = "http"
name = "context7"
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.auth]
type = "static"
api_key_env = "CONTEXT7_API_KEY"
api_key_header = "X-API-Key"
api_key_format = "{token}"

[[mcp_servers]]
name = "trackboi"
transport = "stdio"
command = "trackboi"
args = [
    "mcp",
]
