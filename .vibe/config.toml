active_model = "glm-5-2"
theme = "auto"
skill_paths = [
    "~/.vibe/skills",
    "~/.syncopated/skills",
    ".agents/skills/",
    "~/.gemini/skills",
]
applied_migrations = [
    "bash_read_only_defaults_v1",
]
connectors = [
