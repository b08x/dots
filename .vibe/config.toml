bypass_tool_permissions = false
ask_confirmation_on_exit = true
enable_auto_update = true
enable_update_checks = true
enable_notifications = true
enable_telemetry = true
enable_system_trust_store = false
log_level = "WARNING"
enable_otel = false
otel_endpoint = ""
otel_redaction = "default"
api_timeout = 720.0
api_retry_max_elapsed_time = 300.0
api_connect_timeout = 10.0
api_write_timeout = 30.0
api_pool_timeout = 10.0
vibe_base_url = "https://chat.mistral.ai"
vibe_code_sessions_base_url = "https://chat.mistral.ai"
active_model = ""
allowed_models = []
auto_compact_threshold = 200000
raise_on_compaction_failure = false
tool_paths = []
enabled_tools = []
disabled_tools = []
managed_shell_tools_enabled = false
skill_paths = [
    "~/.agents/skills/",
    "~/.syncopated/skills",
    "~/.vibe/skills",
    "~/.gemini/skills",
    ".agents/skills/",
]
enabled_skills = []
disabled_skills = []
agent_paths = ["~/.vibe/agents", "~/.syncopated/agents"]
enabled_agents = []
disabled_agents = []
installed_agents = ["lean", "agent-creator", "sfl-prompt-engineer"]
default_agent = "accept-edits"
enable_connectors = true
system_prompt_id = "cli"
compaction_prompt_id = "compact"
include_model_info = true
include_project_context = true
include_prompt_detail = true
include_commit_signature = true
worktree_limit = 15
theme = "auto"
console_base_url = "https://console.mistral.ai"
displayed_workdir = ""
disable_welcome_banner_animation = false
show_greeting = true
autocopy_to_clipboard = true
file_watcher_for_autocomplete = true
context_warnings = false
show_thinking_nodes = false
show_subagent_status_list = true
experimental_enable_tab_status = true
voice_mode_enabled = false
narrator_enabled = false
active_transcribe_model = "voxtral-realtime"
active_tts_model = "voxtral-tts"
connectors = [{ name = "my_connector", disabled = false, disabled_tools = [] }]
tts_models = [
    { name = "voxtral-mini-tts-latest", provider = "mistral", alias = "voxtral-tts" },
]
applied_migrations = ["bash_read_only_defaults_v1"]

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
display_name = "Mistral Medium 3.5"
temperature = 1.0
input_price = 1.5
output_price = 7.5
cached_input_price = 0.15
thinking = "high"
supports_images = true
auto_compact_threshold = 200000

[[models]]
name = "mistral-vibe-cli-fast"
provider = "mistral"
alias = "mistral-small"
input_price = 0.1
output_price = 0.3

[[models]]
name = "devstral"
provider = "llamacpp"
alias = "local"
display_name = "Devstral (local)"
input_price = 0.0
output_price = 0.0

[[models]]
name = "zai-glm-5-3"
provider = "mistral"
alias = "glm-5-3"
display_name = "glm-5.3 (Mistral Hosted)"

[vision_model]
name = "mistral-medium-latest"
provider = "mistral"
alias = "vision"
supports_images = true

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_VIBE_API_KEY"
backend = "mistral"

[[providers]]
name = "llamacpp"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
backend = "generic"
emits_finish_reason = false

[tools.bash]
permission = "ask"
max_output_bytes = 16000
default_timeout = 300
allowlist = [
    "basename",
    "cat",
    "cd",
    "choose",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "fd",
    "file",
    "find",
    "fmt",
    "fold",
    "git diff",
    "git log",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "rg",
    "sd",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "wc",
    "which",
    "whoami",
]
denylist = [
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
    "find",
    "awk",
    "sed",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]
sensitive_patterns = ["sudo"]

[tools.git_bash]
permission = "ask"
shell = "C:\\Program Files\\Git\\bin\\bash.exe"

[tools.powershell]
permission = "ask"
shell = "powershell.exe"

[[mcp_servers]]
name = "codebase-memory-mcp"
transport = "stdio"
command = "/home/b08x/.local/bin/codebase-memory-mcp"
args = []

[[mcp_servers]]
transport = "http"
name = "context7"
url = "https://mcp.context7.com/mcp"
startup_timeout_sec = 30.0

[mcp_servers.auth]
type = "static"
api_key_env = "CONTEXT7_API_KEY"
api_key_header = "X-API-Key"
api_key_format = "{token}"

[session_logging]
enabled = true
save_dir = ""
session_prefix = "session"
generate_titles = false

[project_context]
default_commit_count = 5
timeout_seconds = 2.0

[[transcribe_models]]
name = "voxtral-mini-transcribe-realtime-2602"
provider = "mistral"
alias = "voxtral-realtime"

[experiments]
enable = true
