    "cat > /home/b08x/WorkspaceV3/ansible-context-compiler/goals/corpus-and-retrieval/facts-result.json <<'FACTS_RESULT_EOF'\n{\"decision\":\"submitted\",\"stage\":\"facts\",\"result\":{\"stage\":\"facts\",\"title\":\"Ansible Context Compiler — Corpus + Retrieval\",\"goalSlug\":\"corpus-and-retrieval\",\"facts\":[{\"id\":\"fact-scope\",\"text\":\"This goal covers the corpus build and retrieval only: normalization, distillation, chunking, context envelopes, intent annotation, embedding, storage, and hybrid RRF retrieval. The SLM gateway, output staging store, and REST/MCP service surfaces are excluded and become a follow-up goal package.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-sources\",\"text\":\"The corpus ingests all six sources: ansible-collection-fortyau, archlabs, ansible-collection-pop_os, the live Syncopated/ansible repo (read-only, from git), Ansible_RAG, and Ansible_RAG_Tasks.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-provenance\",\"text\":\"Every stored chunk records provenance: source repo, role, file path, and era.\",\"accepted\":false,\"removed\":false,\"comment\":\"confer with ISTGrayIAC skill on this topic\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-dedupe\",\"text\":\"Duplicate generations in the Ansible_RAG archive (e.g. desktop_0/1, applications_0/1/2) are collapsed so no duplicate chunks persist in the corpus.\",\"accepted\":false,\"removed\":false,\"comment\":\"or just removed---leave no trace, ; anything wth *_0/1/2 etc should idealy be extracted then dedupe into a base folder\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-fqcn\",\"text\":\"All module references are FQCN-normalized at ingest. No chunk stores the deprecated `include:` module form, and `hosts:` parser artifacts are filtered out.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-families\",\"text\":\"Near-duplicate tasks distill into pattern families: for example, all package-install tasks across all sources resolve to one package-install family, with member instances linked as provenance.\",\"accepted\":false,\"removed\":false,\"comment\":\"So, like, for example, installing dependencies for any particular project across distributions, the dependencies are the same. The package names will be somehow different, though. And so that's where part of the desire is to have sort of a plug-in piece where there's a single source of truth for programs and applications that would be installed on any given host and compatible versioning with build libraries and kernels. And then from there, package variable lists are generated.\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-merge-review\",\"text\":\"Proposed family merges are staged for human review before they are committed to the corpus.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-chunk\",\"text\":\"The chunk unit is the Ansible task; tasks are never split by character or token count. Unparseable YAML fails closed into a quarantine log instead of entering the corpus.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-envelope\",\"text\":\"Each chunk carries a context envelope: software-arrival tier (OS package / language ecosystem / git clone-release), ownership layer (image / ansible / yadm), and distro family with version constraints.\",\"accepted\":false,\"removed\":false,\"comment\":\"If possible, I'd also like to include in here the pragmatic intent where within the envelope, the chunk, which in this case would be an Ansible task, is the task for a host that will require specific tuning or configuration. Is it processing video? Is it processing audio? Is it processing vector embeddings? Is it a full-fledged development workstation? etc etc\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-annotation\",\"text\":\"Each chunk is annotated with the SFL mapping: ideational (action, target, medium), interpersonal (modality from when/failed_when/ignore_errors, privilege and blast radius from become/scope), textual (tags, handlers, ordering), and register (Field, Tenor, Mode).\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-summaries\",\"text\":\"Each pattern family gets an SLM-generated contextual summary prepended before embedding. Invalid model output fails closed — it never enters the store.\",\"accepted\":true,\"removed\":false,\"comment\":\"And so here, I would put in a retry and fallback. And so if the first retry fails, it'll fall back to the secondary model specified. And if that fails, like if there's no connection for some reason, then the chunk can be marked as such in the database to then be put into a dead letter queue for reprocessing at some point in the future.\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-store\",\"text\":\"The corpus SSOT is PostgreSQL + pgvector with a fresh schema: embeddings in pgvector columns, context envelopes and annotations in JSONB with CHECK constraints, typed structs at parse time.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-filters\",\"text\":\"Retrieval supports scalar filters on distro, tier, module family, era, and validation status.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-rrf\",\"text\":\"Retrieval fuses three ranked channels via reciprocal rank fusion: BM25 keyword search, vector cosine over contextualized embeddings, and a scalar-filter pass.\",\"accepted\":true,\"removed\":false,\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-archaeology\",\"text\":\"Default retrieval excludes stale or deprecated patterns; an explicit archaeology mode retrieves them by era.\",\"accepted\":false,\"removed\":false,\"comment\":\"In this case, era or time frame is irrelevant. The retrieval should focus on the intention and what fits best.\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-golden\",\"text\":\"A golden-query eval passes: the query \\\"install a bleeding-edge cargo crate on AlmaLinux 10.2 with system rust 1.9.2\\\" returns both valid blueprints (pin the crate version to system rust compatibility; install latest rust in user space) in the top results.\",\"accepted\":false,\"removed\":false,\"comment\":\"This can be determined later on. Even if the query is install dependencies for the input mapper reproject, and then install the input mapper or build the input mapper project from source and have it installs a systemd service should print should return not only valid but dry clean low cognitive load.\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-cli\",\"text\":\"A CLI queries the corpus with cited provenance (family plus member instances), and serves as the eval harness for this goal.\",\"accepted\":false,\"removed\":true,\"comment\":\"See how I query through the corpus. Uh, not sure what this means. I'm going to take it out.\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true},{\"id\":\"fact-runtime\",\"text\":\"The pipeline is a fresh Ruby build with a Python sidecar for spaCy/bertopic; embeddings run on local ollama api/embed; annotation uses a hosted SLM. No runtime dependency on prior projects (sfl-compiler, sfl-engine, archive_tools) — they are read as reference only.\",\"accepted\":true,\"removed\":false,\"comment\":\"the Gem whitelist for the project;\\n\\neach gem has a purpose and should be used\\n\\n/home/b08x/WorkspaceV3/context-compiler-Gemlist.json\",\"automatedVerification\":true,\"recommendedAutomatedVerification\":true}],\"factsMarkdown\":\"# Facts\\n\\n- This goal covers the corpus build and retrieval only: normalization, distillation, chunking, context envelopes, intent annotation, embedding, storage, and hybrid RRF retrieval. The SLM gateway, output staging store, and REST/MCP service surfaces are excluded and become a follow-up goal package.\\n- The corpus ingests all six sources: ansible-collection-fortyau, archlabs, ansible-collection-pop_os, the live Syncopated/ansible repo (read-only, from git), Ansible_RAG, and Ansible_RAG_Tasks.\\n- All module references are FQCN-normalized at ingest. No chunk stores the deprecated `include:` module form, and `hosts:` parser artifacts are filtered out.\\n- Proposed family merges are staged for human review before they are committed to the corpus.\\n- The chunk unit is the Ansible task; tasks are never split by character or token count. Unparseable YAML fails closed into a quarantine log instead of entering the corpus.\\n- Each chunk is annotated with the SFL mapping: ideational (action, target, medium), interpersonal (modality from when/failed_when/ignore_errors, privilege and blast radius from become/scope), textual (tags, handlers, ordering), and register (Field, Tenor, Mode).\\n- Each pattern family gets an SLM-generated contextual summary prepended before embedding. Invalid model output fails closed — it never enters the store.\\n- The corpus SSOT is PostgreSQL + pgvector with a fresh schema: embeddings in pgvector columns, context envelopes and annotations in JSONB with CHECK constraints, typed structs at parse time.\\n- Retrieval supports scalar filters on distro, tier, module family, era, and validation status.\\n- Retrieval fuses three ranked channels via reciprocal rank fusion: BM25 keyword search, vector cosine over contextualized embeddings, and a scalar-filter pass.\\n- The pipeline is a fresh Ruby build with a Python sidecar for spaCy/bertopic; embeddings run on local ollama api/embed; annotation uses a hosted SLM. No runtime dependency on prior projects (sfl-compiler, sfl-engine, archive_tools) — they are read as reference only.\"}}\nFACTS_RESULT_EOF\necho \"facts-result.json bytes: $(wc -c < /home/b08x/WorkspaceV3/ansible-context-compiler/goals/corpus-and-retrieval/facts-result.json)\"\necho \"=== gem whitelist names ===\"\njq -r '.[].name' /home/b08x/WorkspaceV3/context-compiler-Gemlist.json | tr '\\n' ' '\necho\necho \"=== gem count: $(jq 'length' /home/b08x/WorkspaceV3/context-compiler-Gemlist.json)\"",
